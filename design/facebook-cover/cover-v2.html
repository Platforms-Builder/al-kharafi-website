  @font-face{font-family:'Tajawal';font-weight:500;src:url('file:///work/projects/my-own/al-kharafi/al-kharafi-website/src/fonts/tajawal-arabic-500.woff2') format('woff2');}
  @font-face{font-family:'Tajawal';font-weight:700;src:url('file:///work/projects/my-own/al-kharafi/al-kharafi-website/src/fonts/tajawal-arabic-700.woff2') format('woff2');}

  *{margin:0;padding:0;box-sizing:border-box}
  :root{--navy:#10243a;--gold:#c8a45d;--gold-2:#e2c98d}
  html,body{width:1640px;height:924px;overflow:hidden;background:var(--navy)}
  .cover{position:relative;width:1640px;height:924px;overflow:hidden;
    background:
      radial-gradient(1200px 700px at 50% 8%, #24406a 0%, rgba(28,53,83,0) 62%),
      radial-gradient(800px 600px at 8% 105%, rgba(200,164,93,.13) 0%, rgba(200,164,93,0) 60%),
      radial-gradient(800px 600px at 92% 105%, rgba(200,164,93,.10) 0%, rgba(200,164,93,0) 60%),
      linear-gradient(180deg,#0d1e31 0%, #10243a 50%, #0a1828 100%);}
  .wm{position:absolute;top:50%;left:50%;transform:translate(-50%,-48%);height:1300px;opacity:.05;filter:brightness(1.5)}
  /* road lines: land transport motif, decorative only (outside desktop crop mostly) */
  .road{position:absolute;left:0;right:0;bottom:0;height:150px;
    background:repeating-linear-gradient(90deg,rgba(200,164,93,.35) 0 60px,transparent 60px 110px) center 118px/100% 3px no-repeat}
  .hair{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,rgba(200,164,93,0),rgba(200,164,93,.5) 50%,rgba(200,164,93,0))}
  .content{position:absolute;left:0;right:0;top:150px;height:624px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;z-index:2;padding-bottom:6px}
  .logo{height:104px;display:block;margin-bottom:10px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
  h1{font-family:'Cairo';font-weight:800;font-size:96px;line-height:1.05;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.35)}
  .tag{font-family:'Cairo';font-weight:600;font-size:36px;line-height:1.3;color:var(--gold);margin-top:10px}
  .en{font-family:'Tajawal-Latin';font-weight:500;font-size:21px;letter-spacing:3px;color:#cdd8e6;text-transform:uppercase;margin-top:12px}
  .en b{font-weight:700;color:#fff;letter-spacing:5px}
  .divider{display:flex;align-items:center;gap:16px;margin:22px 0 22px;width:600px}
  .divider span{flex:1;height:1px;background:linear-gradient(90deg,rgba(200,164,93,0),rgba(200,164,93,.7),rgba(200,164,93,0))}
  .divider i{width:10px;height:10px;background:var(--gold);transform:rotate(45deg)}
  .chips{display:flex;gap:14px}
  .chip{font-family:'Tajawal';font-weight:500;font-size:24px;color:#eef2f7;padding:8px 22px;border:1px solid rgba(200,164,93,.55);border-radius:999px;background:rgba(255,255,255,.04)}
  .contact{display:flex;align-items:center;gap:26px;margin-top:24px;font-family:'Tajawal';font-weight:500;font-size:22px;color:#cdd8e6}
  .num{display:inline-flex;align-items:center;gap:10px}
  .num .kb{font-family:'Tajawal-Latin';font-weight:700;font-size:28px;color:var(--gold-2);direction:ltr;unicode-bidi:isolate;letter-spacing:.5px}
  .ic{width:34px;height:34px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center}
  .ic svg{width:19px;height:19px;fill:var(--navy)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.8}
  .addr{position:absolute;left:0;right:0;top:820px;text-align:center;font-family:'Tajawal';font-weight:500;font-size:24px;color:#9fb0c3}
</style>
</head>
