name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      # Production URL used for canonical links, hreflang, Open Graph and sitemap.xml.
      # Priority: repo variable SITE_URL → siteUrl in site.config.json → the Pages URL
      # (the custom domain set in Settings → Pages, or https://<user>.github.io/<repo>).
      - name: Set production URL
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/set-site-url.mjs
      # base_path is "" with a custom domain, or "/<repo>" for https://<user>.github.io/<repo>/
      - run: npx ng build --base-href "${{ steps.pages.outputs.base_path }}/"
      - run: node scripts/postbuild.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/al-kharafi/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
